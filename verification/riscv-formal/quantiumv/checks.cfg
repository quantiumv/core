[options]
isa rv64i
nbus 0
solver bitwuzla

[depth]
insn            15
reg        5    15
pc_fwd     5    15
pc_bwd     5    15
unique     1  5 15
causal     5    15
cover      1    15
ill             15

# RISCV_FORMAL_COMPRESSED: this core implements Zca unconditionally (RV64IMAC,
# no build knob to disable it), so IALIGN=16 -- a branch/jump target that is
# 2-byte but not 4-byte aligned is legal and must NOT trap. riscv-formal's 8
# control-flow spec models (insn_{beq,bne,blt,bge,bltu,bgeu,jal,jalr}.v) gate
# exactly that rule on this define: without it `ialign16` is 0 and they demand
# strict 4-byte alignment, so the solver picks a 2-mod-4 target and the model
# predicts a misaligned-fetch trap this core correctly never takes. genchecks.py
# only auto-emits the define when the `isa` string contains 'c', which would
# also pull in ~31 Zca-specific c_* checks -- set explicitly instead and leave
# `isa` at rv64i for now (see README's "Next steps" for scaling isa up).
# Verified by grep that nothing outside those 8 models reads it, and that it
# feeds only spec_trap's alignment term (never spec_rd_wdata), so it cannot
# affect any non-control-flow check.

# RISCV_FORMAL_ALIGNED_MEM: switches the generic insn_l*/insn_s*.v spec
# models to (a) expect rvfi_mem_addr as the ALIGNED bus address rather than
# the exact effective address, and (b) require spec_trap=1 whenever the
# access is misaligned. This matches two real core.sv fixes made together:
# the RVFI memory tap now reports mem_addr (aligned) instead of mem_paddr
# (exact) for rvfi_mem_addr, and core.sv now genuinely traps a misaligned
# load/store (mem_load_misaligned/mem_store_misaligned, causes 4/6) instead
# of the old silent mem_sel-shift truncation. Verified via the riscv-formal
# source (insns/isa_rv64i.txt + insn_lb/sb/ld/lwu.v) that this define is
# `ifdef`-scoped only inside the 11 base-ISA load/store spec models and
# their not-yet-generated compressed cousins -- cannot affect any other
# check family. See README.md for the full writeup.
[defines]
`define RISCV_FORMAL
`define RISCV_FORMAL_COMPRESSED
`define RISCV_FORMAL_ALIGNED_MEM

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);

# Yosys's own built-in Verilog-2005 frontend (the default `read -sv`) cannot
# parse this design -- two confirmed, isolated Yosys-frontend limitations
# against modern SystemVerilog this codebase genuinely uses (decoder.sv's
# nested macro token-pasting, c_expand.sv's `return {...}` inside an
# automatic function). Fix: use yosys-slang (a full, separate SystemVerilog
# frontend/plugin) instead, loaded here and invoked directly in
# [script-sources] rather than via genchecks.py's own hardcoded `read -sv`
# line (which only reads the per-check-generated glue file, left as-is).
# See this dir's README.md for the full story and exact repro commands.
[script-defines]
plugin -i /nix/store/07xn6zd11qvkp8h65gwycfisr3x9hk4f-yosys-slang/share/yosys/plugins/slang.so

# --single-unit: without it, each file gets its OWN independent macro
# namespace (slang's default) -- core.sv relies on decoder.sv's own
# `include chain having already defined `INSTR_CODE`/etc earlier in the
# SAME compile (the same cross-file macro-persistence convention iverilog
# already uses for this whole project's real build), which only works if
# all files share one compilation unit.
[script-sources]
read_slang --single-unit -I /mnt/c/Users/Potato/Desktop/core/design -I . -I @basedir@/checks -D RISCV_FORMAL @basedir@/cores/@core@/wrapper.sv /mnt/c/Users/Potato/Desktop/core/design/alu.sv /mnt/c/Users/Potato/Desktop/core/design/decoder.sv /mnt/c/Users/Potato/Desktop/core/design/register_file.sv /mnt/c/Users/Potato/Desktop/core/design/csr_file.sv /mnt/c/Users/Potato/Desktop/core/design/divider.sv /mnt/c/Users/Potato/Desktop/core/design/c_expand.sv /mnt/c/Users/Potato/Desktop/core/design/core.sv
