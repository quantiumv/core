[options]
isa rv64ic
nbus 0
solver bitwuzla

[depth]
insn            15
reg        5    15
pc_fwd     5    15
pc_bwd     5    15
unique     1  5 15
causal     5    15
cover      1    15
ill             15

# csrc_any: the `any` CSR-consistency check family (mepc/mcause/sepc/scause,
# see [csrs] below) goes through genchecks.py's check_cons() -- the same
# code path as reg/pc_fwd/pc_bwd above -- which needs a TWO-number depth
# entry (start, depth), not the single value insn-family checks use. Missing
# this entirely causes check_cons()'s own depth_cfg lookup to silently
# return None and skip check generation with no error -- confirmed by
# reading genchecks.py directly after the checks came up missing the first
# time. 5/15 matches the same start/depth already used for reg/pc_fwd/
# pc_bwd -- these need to observe two retiring instructions (a write, then
# a later read) within the same window, structurally the same shape.
csrc_any   5    15

# div/rem-family: this core's divider (design/divider.sv) is a deliberately
# simple 1-bit-per-cycle restoring divider -- WORD_SIZE (64) cycles for
# every division, unconditionally (no early-exit, no fast path for the W
# variants). The blanket `insn 15` depth is nowhere near enough cycles for
# one of these to ever retire, which is a structural PREUNSAT ("Assumptions
# are unsatisfiable") at check-generation time, not a real RTL bug -- confirmed
# via each check's own logfile.txt. 80 gives the full 64-cycle divide plus
# margin for fetch/decode/commit overhead and reset.
insn_div        80
insn_divu       80
insn_rem        80
insn_remu       80
insn_divw       80
insn_divuw      80
insn_remw       80
insn_remuw      80

# mepc/mcause/sepc/scause: the first RVFI CSR trace ports in this project --
# general free-form R/W trap-handling registers, no WARL/counter/const
# semantics assumed, so `any` (riscv-formal's own default test for a CSR
# like mscratch) is the right check, not a hand-derived bit mask. mstatus
# deliberately NOT included yet (12 real fields, 5 different write sources --
# its own round later). See README.md for the full writeup.
[csrs]
mepc any
mcause any
sepc any
scause any

# RISCV_FORMAL_COMPRESSED is no longer set explicitly here -- now that
# `isa` includes 'c', genchecks.py auto-emits it (see genchecks.py's own
# isa-string handling), which is exactly the condition this define's
# consumers (the 8 control-flow spec models' IALIGN=16 test, and now also
# the Zca-specific c_* checks that generation pulls in) actually need.

# RISCV_FORMAL_ALIGNED_MEM: switches the generic insn_l*/insn_s*.v (and,
# now that `isa` includes 'c', the compressed c_l*/c_s*.v) spec models to
# (a) expect rvfi_mem_addr as the ALIGNED bus address rather than the
# exact effective address, and (b) require spec_trap=1 whenever the
# access is misaligned. This matches two real core.sv fixes made together:
# the RVFI memory tap now reports mem_addr (aligned) instead of mem_paddr
# (exact) for rvfi_mem_addr, and core.sv now genuinely traps a misaligned
# load/store (mem_load_misaligned/mem_store_misaligned, causes 4/6) instead
# of the old silent mem_sel-shift truncation. Verified via the riscv-formal
# source that this define is `ifdef`-scoped only inside those load/store
# spec models -- cannot affect any other check family. See README.md for
# the full writeup.
[defines]
`define RISCV_FORMAL
`define RISCV_FORMAL_ALIGNED_MEM

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);

# Yosys's own built-in Verilog-2005 frontend (the default `read -sv`) cannot
# parse this design -- two confirmed, isolated Yosys-frontend limitations
# against modern SystemVerilog this codebase genuinely uses (decoder.sv's
# nested macro token-pasting, c_expand.sv's `return {...}` inside an
# automatic function). Fix: use yosys-slang (a full, separate SystemVerilog
# frontend/plugin) instead, loaded here and invoked directly in
# [script-sources] rather than via genchecks.py's own hardcoded `read -sv`
# line (which only reads the per-check-generated glue file, left as-is).
# See this dir's README.md for the full story and exact repro commands.
#
# The plugin path below is a /nix/store hash, which is specific to the
# environment it was built in -- this is a genuine external-binary
# dependency, not a path-convention issue a relative path could fix (a
# different environment simply won't have this exact derivation). See
# README.md's "Environment setup" section for how to locate or rebuild it
# elsewhere; update this one line to match.
[script-defines]
plugin -i /home/potato/yosys-slang-src/build/slang.so

# --single-unit: without it, each file gets its OWN independent macro
# namespace (slang's default) -- core.sv relies on decoder.sv's own
# `include chain having already defined `INSTR_CODE`/etc earlier in the
# SAME compile (the same cross-file macro-persistence convention iverilog
# already uses for this whole project's real build), which only works if
# all files share one compilation unit.
#
# Every path below is relative to @basedir@ (riscv-formal's own checkout
# root, substituted by genchecks.py) -- @basedir@/cores/@core@/wrapper.sv
# and .../design/*.sv are NOT stale/broken references to this repo's own
# layout (verification/riscv-formal/quantiumv/wrapper.sv,
# design/*.sv) -- they're the environment-setup sync step's COPY
# destination inside the riscv-formal checkout (see README.md's
# "Environment setup": `cp <this-dir>/wrapper.sv <this-dir>/checks.cfg
# quantiumv/`, extended to also copy `design/*.sv` into a `design/`
# subdirectory there). Keeping everything under @basedir@ instead of an
# absolute repo path makes this config portable across machines/users --
# only the sync step's own destination path needs to exist, not any
# particular absolute location for the real repo checkout.
[script-sources]
read_slang --single-unit -I @basedir@/cores/@core@/design -I . -I @basedir@/checks -D RISCV_FORMAL @basedir@/cores/@core@/wrapper.sv @basedir@/cores/@core@/design/alu.sv @basedir@/cores/@core@/design/decoder.sv @basedir@/cores/@core@/design/register_file.sv @basedir@/cores/@core@/design/csr_file.sv @basedir@/cores/@core@/design/divider.sv @basedir@/cores/@core@/design/c_expand.sv @basedir@/cores/@core@/design/core.sv

# mepc/mcause/sepc/scause csrc_any checks: the generic `any` CSR-consistency
# checker (rvfi_csrc_any_check.sv) never references privilege mode at all --
# it assumes every CSRRW/RS/RC targeting the CSR's address always completes
# as a literal write. On this multi-privilege core that's false for M/S-mode-
# gated CSRs: core.sv's own access check (csr_priv_violation, core.sv:1020)
# traps as illegal-instruction when imm_2[9:8] > current_priv, so the solver
# can (and did -- confirmed via witness replay on csrc_any_mcause_ch0) pick a
# trace where the CSRRW instruction traps instead of writing, producing a
# spurious counterexample despite correct RTL. These `!`-prefixed [assume]
# blocks scope each check to the privilege level where the access actually
# succeeds, matching what the generic checker implicitly assumes -- NOTE the
# genchecks.py pattern-matching convention is inverted from the intuitive
# reading: a bare pattern EXCLUDES matches, only a `!`-prefixed one INCLUDES
# only matches (confirmed by reading genchecks.py's own matching loop
# directly, not assumed). mepc/mcause are M-mode-only (CSR addr bits[9:8]
# ==2'b11); sepc/scause need S-mode-or-above (bits[9:8]==2'b01, i.e. not U).
[assume !csrc_any_(mepc|mcause)_ch0]
always @* if (rvfi_valid) assume (rvfi_mode == 2'b11);

[assume !csrc_any_(sepc|scause)_ch0]
always @* if (rvfi_valid) assume (rvfi_mode != 2'b00);
