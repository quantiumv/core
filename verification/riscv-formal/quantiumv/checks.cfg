[options]
isa rv64ic
nbus 0
solver bitwuzla

[depth]
insn            15
reg        5    15
pc_fwd     5    15
pc_bwd     5    15
unique     1  5 15
causal     5    15
cover      1    15
ill             15

# csrc_any: the `any` CSR-consistency check family (mepc/mcause/sepc/scause,
# see [csrs] below) goes through genchecks.py's check_cons() -- the same
# code path as reg/pc_fwd/pc_bwd above -- which needs a TWO-number depth
# entry (start, depth), not the single value insn-family checks use. Missing
# this entirely causes check_cons()'s own depth_cfg lookup to silently
# return None and skip check generation with no error -- confirmed by
# reading genchecks.py directly after the checks came up missing the first
# time. 5/15 matches the same start/depth already used for reg/pc_fwd/
# pc_bwd -- these need to observe two retiring instructions (a write, then
# a later read) within the same window, structurally the same shape.
csrc_any   5    15

# div/rem-family: this core's divider (design/divider.sv) is a deliberately
# simple 1-bit-per-cycle restoring divider -- WORD_SIZE (64) cycles for
# every division, unconditionally (no early-exit, no fast path for the W
# variants). The blanket `insn 15` depth is nowhere near enough cycles for
# one of these to ever retire, which is a structural PREUNSAT ("Assumptions
# are unsatisfiable") at check-generation time, not a real RTL bug -- confirmed
# via each check's own logfile.txt. 80 gives the full 64-cycle divide plus
# margin for fetch/decode/commit overhead and reset.
insn_div        80
insn_divu       80
insn_rem        80
insn_remu       80
insn_divw       80
insn_divuw      80
insn_remw       80
insn_remuw      80

# mepc/mcause/sepc/scause: the first RVFI CSR trace ports in this project --
# general free-form R/W trap-handling registers, no WARL/counter/const
# semantics assumed, so `any` (riscv-formal's own default test for a CSR
# like mscratch) is the right check, not a hand-derived bit mask... except
# mepc/sepc DO have one real WARL bit each: design/csr_file.sv's own
# mepc_q/sepc_q write arms both do `{i_csr_wdata[WORD_SIZE-1:1], 1'b0}` --
# bit 0 is hardwired 0 on every CSR write (spec-mandated minimum
# instruction-alignment WARL behavior; bit 1 stays free since this core
# has the C extension, IALIGN=16). `any_mask="64'hfffffffffffffffe"`
# (riscv-formal's own supported csrc test-string suffix, see
# rvfi_csrc_any_check.sv's own RISCV_FORMAL_CSRC_MASK handling: it both
# masks csr_insn_rdata/wdata AND assumes the captured write-source value
# already satisfies the mask) tells the generic checker about exactly
# that one hardwired bit -- confirmed via direct counterexample replay
# this is REQUIRED, not optional: csrc_any_mepc_ch0 FAILed with rsval !=
# wdata differing only in bit 0 once the truncation bug below was fixed
# in isolation. mcause/scause have no such masking (mcause_q/scause_q
# write arms are bare `<= i_csr_wdata`, confirmed by reading both
# directly) so stay plain `any`. mstatus deliberately NOT included yet
# (12 real fields, 5 different write sources -- its own round later).
# See README.md for the full writeup.
[csrs]
mepc any_mask="64'hfffffffffffffffe"
mcause any
sepc any_mask="64'hfffffffffffffffe"
scause any

# csrc_any_mepc_ch0 FAIL, part 2 of 2 -- a genuine XLEN=64 portability bug
# in riscv-formal's OWN generic checker, found via direct counterexample
# replay (CSRRS x7, mepc, x12 retiring with x12's upper 32 bits non-zero;
# the checker's captured "write source" value came back zero-extended
# from only the LOW 32 bits, while the real rvfi_csr_mepc_wdata it's
# compared against correctly carried all 64). Root cause:
# rvfi_csrc_any_check.sv's own `csr_rsval` wire (captures rs1_rdata for
# a register-form CSRRW/RS/RC, or the 5-bit zimm for the immediate form)
# is hand-declared `wire [31:0]` -- hardcoded, NOT `[`RISCV_FORMAL_XLEN-1:0]`
# like every other data-width wire in that same file (csr_insn_rmask/
# wmask/rdata/wdata, `rsval_shadow`/`wdata_shadow` it feeds into) -- an
# obvious inconsistency, not an intentional 32-bit-only design choice.
# On any XLEN=64 core, assigning the 64-bit rvfi.rs1_rdata into this
# 32-bit wire silently truncates the upper half before it's ever
# compared, so ANY register-sourced CSR write with non-zero upper bits
# trivially breaks the checker's own same-write self-consistency assert
# (rvfi_csrc_any_check.sv:85) -- independent of, and compounding, the
# WARL-mask gap above (fixing only one still leaves the solver free to
# break the check via the other). Not fixable from checks.cfg (there's
# no assume-scoping equivalent for a hardcoded internal wire width) --
# needs the SAME class of one-time hand-patch to riscv-formal's own
# shared checks/rvfi_csrc_any_check.sv as satp's rvfi_testbench.sv patch
# above, but this one is a straightforward upstream bug fix (widening a
# clearly-wrong hardcoded width to the already-parameterized XLEN),
# not a "scope away a real behavior this check family isn't testing"
# workaround -- see README.md's "Environment setup" for the exact patch.

# RISCV_FORMAL_COMPRESSED is no longer set explicitly here -- now that
# `isa` includes 'c', genchecks.py auto-emits it (see genchecks.py's own
# isa-string handling), which is exactly the condition this define's
# consumers (the 8 control-flow spec models' IALIGN=16 test, and now also
# the Zca-specific c_* checks that generation pulls in) actually need.

# RISCV_FORMAL_ALIGNED_MEM: switches the generic insn_l*/insn_s*.v (and,
# now that `isa` includes 'c', the compressed c_l*/c_s*.v) spec models to
# (a) expect rvfi_mem_addr as the ALIGNED bus address rather than the
# exact effective address, and (b) require spec_trap=1 whenever the
# access is misaligned. This matches two real core.sv fixes made together:
# the RVFI memory tap now reports mem_addr (aligned) instead of mem_paddr
# (exact) for rvfi_mem_addr, and core.sv now genuinely traps a misaligned
# load/store (mem_load_misaligned/mem_store_misaligned, causes 4/6) instead
# of the old silent mem_sel-shift truncation. Verified via the riscv-formal
# source that this define is `ifdef`-scoped only inside those load/store
# spec models -- cannot affect any other check family. See README.md for
# the full writeup.
[defines]
`define RISCV_FORMAL
`define RISCV_FORMAL_ALIGNED_MEM

# RISCV_FORMAL_CSR_PMPCFG0/PMPADDR0: deliberately set here in the global
# [defines] block, NOT via a `pmpcfg0 any`/`pmpaddr0 any` entry in [csrs]
# below. [csrs] is genchecks.py's own registration mechanism for BOTH (a)
# turning on a CSR's RVFI trace ports on every check, AND (b) generating a
# brand new csrc_any_<name>_ch* check family for it -- we only want (a).
# core.sv (see its own port-list/assignment comments near rvfi_csr_pmpcfg0_*)
# exposes these two unconditionally whenever RISCV_FORMAL_CSR_PMPCFG0/
# PMPADDR0 are defined at all, same as every other rvfi_csr_* port; setting
# the defines here (applied to every generated check, same as
# RISCV_FORMAL_ALIGNED_MEM above) is what actually turns the connection on.
# See the [assume !insn_.*_ch0 !c_.*_ch0] block below for why insn_*/c_*
# specifically need to read these.
`define RISCV_FORMAL_CSR_PMPCFG0
`define RISCV_FORMAL_CSR_PMPADDR0

# RISCV_FORMAL_CSR_MEDELEG: same reasoning as PMPCFG0/PMPADDR0 above --
# see the fetch-fault [assume !insn_.*_ch0 !c_.*_ch0] block below for why
# insn_*/c_* needs this one specifically (pinning two delegation bits so
# a fetch-fault trap's cause is guaranteed to land in mcause, never
# scause -- at the time this was found, "scause" wasn't a name riscv-
# formal's own macro generator recognized at all, confirmed by grepping
# rvfi_macros.vh directly: zero matches, vs. mepc/mcause/medeleg which
# all had full `rvformal_csr_<name>_*` macro families (sepc did NOT --
# an error in this comment's own earlier version, never individually
# verified at the time; see the csrc_any_sepc/scause fix further down in
# this file for the real story and the fourth-hand-patch fix, since
# applied upstream -- scause/sepc both have full macro support now too).
`define RISCV_FORMAL_CSR_MEDELEG

# satp (referenced by the [assume !insn_.*_ch0 !c_.*_ch0] block below, see
# its own comment for the full why) deliberately has NO RISCV_FORMAL_CSR_*
# define here, unlike every CSR above -- "satp" isn't a name riscv-formal's
# own rvfi_macros.py generator recognizes at all (confirmed: grepping
# rvfi_macros.vh directly finds zero `rvformal_csr_satp_*` macros, same gap
# "scause" has), so there's no generator switch to flip. The real wiring is
# three hand-added pieces instead: design/core.sv's own rvfi_csr_satp_*
# port-list/assignment (mirrors medeleg's existing pattern, driven from the
# real satp_w control-plane export), wrapper.sv's matching hand-added port
# + connection, and a one-time hand-patch to riscv-formal's own shared
# checks/rvfi_testbench.sv (NOT part of this repo -- see README.md's
# "Environment setup" for the exact patch, needed once per fresh
# riscv-formal checkout).

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);

# Yosys's own built-in Verilog-2005 frontend (the default `read -sv`) cannot
# parse this design -- two confirmed, isolated Yosys-frontend limitations
# against modern SystemVerilog this codebase genuinely uses (decoder.sv's
# nested macro token-pasting, c_expand.sv's `return {...}` inside an
# automatic function). Fix: use yosys-slang (a full, separate SystemVerilog
# frontend/plugin) instead, loaded here and invoked directly in
# [script-sources] rather than via genchecks.py's own hardcoded `read -sv`
# line (which only reads the per-check-generated glue file, left as-is).
# See this dir's README.md for the full story and exact repro commands.
#
# The plugin path below is a /nix/store hash, which is specific to the
# environment it was built in -- this is a genuine external-binary
# dependency, not a path-convention issue a relative path could fix (a
# different environment simply won't have this exact derivation). See
# README.md's "Environment setup" section for how to locate or rebuild it
# elsewhere; update this one line to match.
[script-defines]
plugin -i /home/potato/yosys-slang-src/build/slang.so

# --single-unit: without it, each file gets its OWN independent macro
# namespace (slang's default) -- core.sv relies on decoder.sv's own
# `include chain having already defined `INSTR_CODE`/etc earlier in the
# SAME compile (the same cross-file macro-persistence convention iverilog
# already uses for this whole project's real build), which only works if
# all files share one compilation unit.
#
# Every path below is relative to @basedir@ (riscv-formal's own checkout
# root, substituted by genchecks.py) -- @basedir@/cores/@core@/wrapper.sv
# and .../design/*.sv are NOT stale/broken references to this repo's own
# layout (verification/riscv-formal/quantiumv/wrapper.sv,
# design/*.sv) -- they're the environment-setup sync step's COPY
# destination inside the riscv-formal checkout (see README.md's
# "Environment setup": `cp <this-dir>/wrapper.sv <this-dir>/checks.cfg
# quantiumv/`, extended to also copy `design/*.sv` into a `design/`
# subdirectory there). Keeping everything under @basedir@ instead of an
# absolute repo path makes this config portable across machines/users --
# only the sync step's own destination path needs to exist, not any
# particular absolute location for the real repo checkout.
[script-sources]
read_slang --single-unit -I @basedir@/cores/@core@/design -I . -I @basedir@/checks -D RISCV_FORMAL @basedir@/cores/@core@/wrapper.sv @basedir@/cores/@core@/design/alu.sv @basedir@/cores/@core@/design/decoder.sv @basedir@/cores/@core@/design/register_file.sv @basedir@/cores/@core@/design/csr_file.sv @basedir@/cores/@core@/design/divider.sv @basedir@/cores/@core@/design/c_expand.sv @basedir@/cores/@core@/design/core.sv

# mepc/mcause/sepc/scause csrc_any checks: the generic `any` CSR-consistency
# checker (rvfi_csrc_any_check.sv) never references privilege mode at all --
# it assumes every CSRRW/RS/RC targeting the CSR's address always completes
# as a literal write. On this multi-privilege core that's false for M/S-mode-
# gated CSRs: core.sv's own access check (csr_priv_violation, core.sv:1020)
# traps as illegal-instruction when imm_2[9:8] > current_priv, so the solver
# can (and did -- confirmed via witness replay on csrc_any_mcause_ch0) pick a
# trace where the CSRRW instruction traps instead of writing, producing a
# spurious counterexample despite correct RTL. These `!`-prefixed [assume]
# blocks scope each check to the privilege level where the access actually
# succeeds, matching what the generic checker implicitly assumes -- NOTE the
# genchecks.py pattern-matching convention is inverted from the intuitive
# reading: a bare pattern EXCLUDES matches, only a `!`-prefixed one INCLUDES
# only matches (confirmed by reading genchecks.py's own matching loop
# directly, not assumed). mepc/mcause are M-mode-only (CSR addr bits[9:8]
# ==2'b11); sepc/scause need S-mode-or-above (bits[9:8]==2'b01, i.e. not U).
[assume !csrc_any_(mepc|mcause)_ch0]
always @* if (rvfi_valid) assume (rvfi_mode == 2'b11);

[assume !csrc_any_(sepc|scause)_ch0]
always @* if (rvfi_valid) assume (rvfi_mode != 2'b00);

# Same "generic checker never references X" shape as the privilege-mode gap
# just above, this time for X = "any OTHER write source this CSR has besides
# the CSRRW/RS/RC instruction being tested" -- found by direct counterexample
# replay after the WARL-mask/truncation-bug fixes (see [csrs] above) got all
# four csrc_any checks past their original FAILs and onto a NEW one (mepc/
# mcause: line 84; sepc: line 85; scause: line 89, all rvfi_csrc_any_check.sv).
# rvfi_csrc_any_check.sv's own model captures rsval_shadow/wdata_shadow ONCE,
# at whatever earlier cycle a genuine CSRRW/RS/RC to the CSR under test
# retires, then -- at the single designated check cycle -- asserts the CSR's
# CURRENT read-back still matches that one captured write, i.e. it assumes
# nothing else ever touches this register in between. False for all four:
# mepc/sepc are also written by ANY trap taken from a lower/the same
# privilege level (design/core.sv's own trap_taken arm, `i_trap_to_s ?
# sepc_q : mepc_q <= i_trap_pc`), and mcause/scause are likewise overwritten
# by that same trap event's cause. Confirmed via direct trace replay
# (csrc_any_mepc_ch0's own counterexample): a real CSRRW retires and
# correctly writes mepc, but a LATER, unrelated instruction traps before the
# check cycle, overwriting mepc with ITS OWN trap PC -- a real, correct
# hardware behavior (already directly proven by the EBREAK Real-Trap/
# Interrupt-Taking/Sv39-PTW milestones' own dedicated tests) the generic
# checker has no way to know about, same blind spot shape as PMP/satp
# above but for "another real write source" instead of "another real fault
# source." Fix: exclude traps entirely from this check family's own bounded
# window -- this family's job is the plain CSRRW/RS/RC R/W path specifically,
# not re-proving trap-entry CSR writes (which already have their own
# dedicated coverage elsewhere).
#
# `!rvfi_trap` alone turned out to be an INCOMPLETE fix, not a wrong one --
# confirmed by re-running after applying it: csrc_any_mepc_ch0 still FAILed,
# same assertion, on a NEW counterexample. Direct trace replay (every
# value-change event, not just the coarse sample points used earlier --
# the standard per-cycle sample missed this) showed mepc_q genuinely
# changing value on a cycle where rvfi_valid was 0 the ENTIRE cycle --
# i.e. no instruction retired at all, so `rvfi_trap` (a per-RETIREMENT
# flag, meaningless when nothing retires) was never available to exclude
# it. Root cause: an ASYNCHRONOUS interrupt, not a synchronous trap --
# `i_trap_taken && !i_trap_to_s` covers both (core.sv's own trap_taken
# is the general trap-entry condition, synchronous or async), but only
# a SYNCHRONOUS trap necessarily lands on a retiring instruction's own
# rvfi_trap. An async interrupt can preempt between instructions with no
# corresponding rvfi_valid pulse of its own.
#
# `!rvfi_trap && !rvfi_intr` (rvfi_intr being this project's own rvfi_intr
# Milestone signal, a mechanical retirement-to-retirement PC-discontinuity
# check meant to catch exactly the async case above) STILL turned out
# incomplete -- re-running yet again after that fix, all four checks
# FAILed a THIRD time, on yet another new counterexample each. Rather
# than chase a fourth RVFI-level derived signal, switched approach:
# rvfi_trap and rvfi_intr are each a mechanically-DERIVED reflection of
# the real gating condition (core.sv's own trap_taken || interrupt_taken,
# the exact expression wired to csr_file0's i_trap_taken input -- see
# core.sv's own rvfi_any_trap_taken port-list/assignment comments), and a
# derived signal is exactly where a subtle pipeline-timing gap between
# the derivation and the real event can hide -- confirmed by rvfi_intr's
# own comment in core.sv: it's deliberately a MECHANICAL pc-continuity
# check, not a direct reference to trap_taken/interrupt_taken, specifically
# so it stays robust to future redirect mechanisms -- robust to new
# mechanisms, but not necessarily bit-exact-synchronized with THIS one on
# every cycle. rvfi_any_trap_taken reaches the real condition directly,
# and (unlike rvfi_trap/rvfi_intr, both retirement-scoped and thus
# necessarily gated on rvfi_valid) is asserted unconditionally, every
# single cycle regardless of whether anything retires that cycle --
# structurally unable to have the same class of gap a third time.
[assume !csrc_any_(mepc|mcause|sepc|scause)_ch0]
always @* assume (!rvfi_any_trap_taken);

# PMP (shipped 2026-09-08, after this suite was last confirmed 56/56 --
# the README's own claim predates PMP entirely) is a NEW source of the
# exact same class of gap csrc_any's own assume blocks above already
# fix: the generic RVFI insn_*.v/c_*.v spec models have zero PMP
# awareness -- they universally expect spec_trap=0 for a cleanly-decoded
# instruction with no memory misalignment/illegal-encoding/privilege
# issue. With PMP CSRs left fully free/unconstrained (as every other CSR
# correctly is, for genuine coverage), the solver is free to pick a
# config that legitimately, per real spec (norm:pmp_rwx_check/
# norm:pmp_no_entry_match), denies the checked instruction's own fetch
# or mem access -- a real, spec-correct trap the RTL is right to take,
# that the generic spec model simply has no way to know about. Pin PMP
# to its own real, documented reset value (permissive region 0 covering
# the entire address space, regions 1-3 OFF) for every cycle of the
# insn_*/c_* family's own bounded window, mirroring csrc_any's own
# "scope away a real, spec-correct but spec-model-unaware trap path"
# precedent exactly. core.sv's own dedicated core_pmp_tb.sv and
# randomized PMP property test already prove PMP's own enforcement
# logic directly -- this family's job is base-ISA correctness, not
# re-proving PMP, matching why mstatus was deliberately left out of the
# csrc_any [csrs] list too.
#
# A first attempt at this pinned the individual pmpNcfg_*_q flops via a
# raw hierarchical reference (wrapper.uut.csr_file0.pmp0cfg_a_q etc.)
# straight into csr_file0's internal state -- this produced PREUNSAT
# ("Assumptions are unsatisfiable"), not a resolved check. Root cause,
# confirmed via the base-step log's own "Identifier ... is implicitly
# declared" warning: this [assume] block's own assume_stmts.vh is
# `include`d into rvfi_testbench.sv, which Yosys's classic `read -sv`
# frontend parses -- a SEPARATE frontend invocation from the read_slang
# pass that reads wrapper.sv/design/*.sv (see this file's own
# [script-sources] comment for why two frontends are needed at all).
# `read -sv` cannot resolve a hierarchical reference reaching into a
# module it never itself parsed; instead of an error it silently
# implicitly-declares a fresh, undriven wire with that literal dotted
# name, which prep/opt then ties to a fixed default -- directly
# contradicting the assume and making the whole model UNSAT. Confirmed
# by bisecting to a single assume line (pmp0cfg_a_q alone still UNSAT)
# and grepping the base-step log for the exact identifier.
#
# Fix: expose PMP region 0's already-existing control-plane export wires
# (pmpcfg0_w/pmpaddr0_w, csr_file0's own o_pmpcfg0/o_pmpaddr0 -- real
# hardware signals already driving PMP enforcement in core.sv, not new
# state) as two new native RVFI CSR trace ports, exactly mirroring how
# mepc/mcause/sepc/scause already solved needing to reach core-internal
# state from an assume block (see core.sv's own rvfi_csr_pmpcfg0_*/
# rvfi_csr_pmpaddr0_* port-list and assignment comments). Turned on here
# via [defines] rather than [csrs] (see that block's own comment) so no
# new csrc_any_pmpcfg0_ch* check family gets generated -- these ports
# exist solely so this assume block has something in its own read -sv-
# parsed scope to reference, the same bare (non-hierarchical) way the
# csrc_any assume blocks above already reference rvfi_mode/rvfi_valid.
#
# Values: pmpcfg0's low byte packs pmp0cfg (l=0,a=2'b11 NAPOT,x=w=r=1 ->
# 8'h1f) with pmp1-3cfg (all-zero, OFF) in the next three bytes and
# regions 4-7 hardcoded 0 above that -- 64'h1f. pmpaddr0 resets to
# 64'h003f_ffff_ffff_ffff (all-1s in the implemented 54-bit field), the
# real NAPOT encoding for "matches the entire address space" -- both
# values taken directly from design/csr_file.sv's own reset arms, not
# re-derived by hand.
[assume !insn_.*_ch0 !c_.*_ch0]
always @* assume (rvfi_csr_pmpcfg0_rdata == 64'h0000_0000_0000_001f);
always @* assume (rvfi_csr_pmpaddr0_rdata == 64'h003f_ffff_ffff_ffff);

# Environment-injected access/page faults (causes 1/5/7/12/13/15): a
# DIFFERENT real gap from PMP above, found post-fix while re-sweeping
# the insn_*/c_* family (insn_c_andi_ch0's own counterexample first --
# see riscv-formal-integration-status memory for the fuller trace).
# These six causes share one property none of the OTHER trap causes
# have: nothing about them is derivable from the checked instruction's
# own bits/operands -- they're injected by the memory SYSTEM (wb_err_i,
# a free/solver-chosen input -- wrapper.sv's own `rvformal_rand_reg
# wb_err`) or by Sv39 translation (a PTE the solver is equally free to
# shape), not by the instruction itself. Every generic riscv-formal
# spec model (rvfi_insn_lb.sv etc.) is pure ISA-level and has zero
# concept of either source -- it always expects a clean, non-trapping
# retirement for a well-formed load/fetch/store, so the solver is free
# to inject either fault on ANY insn_*/c_* check and produce a spurious
# counterexample despite correct RTL. Two distinct failure shapes fall
# out of this ONE root cause, confirmed via two separate counterexamples:
#  - Fetch faults (1/12): design/core.sv's own S_FETCH arm captures
#    instr_line_q[cur_slot] from wb_dat_i unconditionally on wb_done
#    (ack OR err -- confirmed by reading that arm directly), and per
#    Wishbone B4 semantics wb_dat_i is meaningless on an errored
#    response. So on a fetch-fault retirement rvfi_insn's own bit
#    pattern is pure solver-chosen noise, not "the instruction that was
#    fetched" -- it can (and did, in insn_c_andi_ch0's counterexample)
#    coincidentally alias a legal insn_*/c_* opcode, engaging a spec
#    model for an instruction that was never really fetched at all.
#  - Mem faults (5/7/13/15): a DIFFERENT mechanism reaching the SAME
#    "spec_trap == trap" assertion (rvfi_insn_check.sv:198) -- proven
#    wrong by direct counterexample replay (insn_lb_ch0's own trace):
#    rvfi_insn there IS the real, correctly-fetched `lb` opcode (no
#    aliasing), mem_addr sits well inside the PMP-permitted range pinned
#    above, yet the RTL still legitimately traps with mcause=5 because
#    wb_err_i fired during the LOAD's own bus transaction -- a real,
#    spec-correct access-fault trap (core.sv's own dedicated Bus-Error
#    Trapping Milestone test, core_bus_fault_trap_tb.sv, already proves
#    this path directly) that the generic load spec model has no way to
#    know about, same blind spot as the fetch case, different trigger.
#    (An earlier version of this comment claimed mem-side causes 5/7
#    happen "strictly after a real, valid fetch" and so didn't need
#    excluding -- true of rvfi_insn's validity, but irrelevant: the
#    spec model's blindness to bus/translation faults applies on the
#    DATA side exactly as much as the fetch side, independent of
#    whether rvfi_insn itself is trustworthy. insn_lb_ch0's FAIL after
#    the fetch-only fix, with a confirmed-legitimate rvfi_insn in the
#    trace, is what caught the gap in that reasoning.)
#
# Checking only rvfi_csr_mcause_wdata (not scause too) needs one more
# piece: o_mcause_next/o_scause_next (csr_file.sv) are each only live on
# the cycle their OWN privilege level is the trap target (i_trap_taken
# && (!i_trap_to_s / i_trap_to_s) respectively, confirmed by reading
# both assigns directly) -- any of these faults delegated to S-mode
# would show up in scause, not mcause, slipping straight past an
# mcause-only assume. First attempt checked BOTH mcause and scause
# together, same shape as this block still does for mcause alone -- but
# that produced a real, silent gap: PREUNSAT never fired (the assume is
# satisfiable either way) and the check kept FAILing on a genuinely
# different counterexample, root-caused via the base-step log's own
# "Identifier `rvfi_csr_scause_wdata' is implicitly declared" warning
# (same failure SHAPE as PMP's own first-attempt bug above, different
# cause this time: at the time this was found, "scause" simply wasn't a
# CSR name riscv-formal's rvfi_macros.py generator recognized at all --
# grepping rvfi_macros.vh directly found zero `rvformal_csr_scause_*`
# macros, unlike mepc/mcause/medeleg, which all had the full macro
# family (an EARLIER version of this comment also claimed sepc was in
# that "already works" group -- wrong, never actually individually
# verified; see the csrc_any_sepc/scause fix further down in this file,
# and README.md's own "Fourth one-time hand-patch", for the real story:
# sepc/scause were BOTH missing from rvfi_macros.py's own csrs list,
# now fixed upstream, so RISCV_FORMAL_CSR_SCAUSE would actually wire
# something real today -- this fix is kept as-is below regardless,
# since it remains correct and the medeleg-pinning approach has zero
# downside over checking scause directly). At the time, though,
# RISCV_FORMAL_CSR_SCAUSE silently wired nothing real, and the
# reference resolved to yet another disconnected implicit wire. Fix:
# pin medeleg's own bits for all six causes (via the same new RVFI CSR
# port trick, see core.sv's own rvfi_csr_medeleg_* port-list/assignment
# comments) so none of them can ever be delegated to S-mode in the
# first place -- mcause alone is then structurally guaranteed to see
# them, with zero loss of U/S-mode EXECUTION coverage for the checked
# instruction itself (only these six causes' own delegation is pinned;
# every other exception's delegation, and which mode the checked
# instruction itself runs in, stays fully free). Gated on rvfi_trap so
# the mcause clause never constrains a normal (non-trapping) retirement
# or an ordinary CSR write to mcause; an async interrupt's own cause
# always has bit 63 set (see core.sv's own i_trap_cause mux), so it can
# never equal any of these bare literals and needs no separate
# exclusion.
[assume !insn_.*_ch0 !c_.*_ch0]
always @* assume (rvfi_csr_medeleg_rdata[1]  == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[5]  == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[7]  == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[12] == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[13] == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[15] == 1'b0);
always @* if (rvfi_valid && rvfi_trap) assume (
    rvfi_csr_mcause_wdata != 64'd1  && rvfi_csr_mcause_wdata != 64'd5  &&
    rvfi_csr_mcause_wdata != 64'd7  && rvfi_csr_mcause_wdata != 64'd12 &&
    rvfi_csr_mcause_wdata != 64'd13 && rvfi_csr_mcause_wdata != 64'd15
);

# satp (Sv39 translation mode): a THIRD, distinct gap in the SAME family as
# PMP/medeleg above, caught by insn_lb_ch0's own counterexample surviving
# the mcause/medeleg fix above -- with rvfi_insn confirmed a real,
# correctly-fetched `lb` and mcause/medeleg no longer explaining the FAIL,
# the remaining failing assertion was rvfi_insn_check.sv's mem_addr check
# (`rvformal_addr_eq(spec_mem_addr, mem_addr)`), on a NON-trapping
# retirement. Root cause, confirmed by direct trace replay: design/core.sv's
# own rvfi_mem_addr assign (see its own comment there) deliberately reports
# mem_paddr -- the POST-Sv39-translation PHYSICAL address, this project's
# own established naming convention -- while every generic riscv-formal
# insn_l*/insn_s*/insn_amo spec model computes spec_mem_addr from bare
# rs1_rdata+imm with zero Sv39 awareness whatsoever, the same blind spot
# PMP already has for access legality (see that comment above) but this
# time for the ADDRESS VALUE itself. With satp fully free (as it correctly
# is for genuine Sv39 coverage elsewhere -- core.sv's own dedicated Sv39
# milestones already prove translation correctness directly, see git log
# for that 6-milestone plan), the solver can pick any satp+PTE combination
# that maps the checked instruction's virtual address to an unrelated
# physical one, trivially breaking rvfi_mem_addr's match against the
# spec's untranslated expectation -- confirmed via insn_lb_ch0's own trace:
# rs1=x2=0, a -2044 immediate giving an obviously-correct expected virtual
# address of 64'hffff_ffff_ffff_f800 (sign-extended, aligned down per
# RISCV_FORMAL_ALIGNED_MEM), yet the retiring rvfi_mem_addr was
# 64'h0088_0000_3fff_f800 -- no relation to the virtual address at all,
# only explainable by an arbitrary, solver-chosen translation.
#
# Fix: pin satp to its real reset value (Bare mode, MODE=0 -- see
# design/csr_file.sv's own satp reset arm) for the insn_*/c_* family, same
# "this family's job is base-ISA correctness, not re-proving Sv39" scoping
# already applied to PMP. With satp forced Bare, mem_paddr can never
# diverge from the untranslated effective address (core.sv's own S_PTW
# path is structurally unreachable when satp_mode_w == 0), closing the gap
# with zero loss of translation-specific coverage (that's what the Sv39
# milestones' own dedicated tests already own). "satp" isn't a
# riscv-formal-recognized CSR name (see the [defines] block's own comment
# just above), so rvfi_csr_satp_rdata is NOT wired by any generic
# `RVFI_WIRES`/`RVFI_CONN` machinery -- unlike PMP/medeleg this couldn't be
# closed with only new core.sv/wrapper.sv ports; it also needed a one-time
# hand-patch to riscv-formal's own shared checks/rvfi_testbench.sv (adding
# exactly the bare, testbench-scope wire + wrapper port connection that
# `RVFI_WIRES`/`RVFI_CONN` would have generated for a recognized name --
# see README.md's "Environment setup" for the exact patch and why a
# hierarchical reference into wrapper can't substitute for it).
[assume !insn_.*_ch0 !c_.*_ch0]
always @* assume (rvfi_csr_satp_rdata == 64'b0);
