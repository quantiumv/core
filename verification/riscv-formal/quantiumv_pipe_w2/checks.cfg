# riscv-formal configuration for design/pipe/core.sv at two-wide (O4): two retirement channels (nret 2; channel 0
# is the older) and both dispatch and the ALU at two (QV_PIPE_COMMIT_W, QV_PIPE_DISPATCH_W, QV_PIPE_ALU_PORTS = 2),
# with QV_FORMAL_SMALL, QV_FORMAL_NO_MUL, QV_FORMAL_NO_SV39 and QV_FORMAL_NO_FPU as in ../quantiumv_pipe/checks.cfg
# (see its comments). The one-channel models keep COMMIT_W 1; this one checks the second retirement.
#
# The sweep runs a subset (run_sweep.sh pipe-w2 --only ...): reg, pc_fwd, pc_bwd, unique, causal and liveness on
# both channels, hang, cover, and both channels of a few instruction checks. No ill_ch1: it assumes channel 1 valid
# with an instruction word that always faults, and a faulting uop never retires second, so it is unsatisfiable.
#
# The pins of the one-channel model, per channel: genchecks applies an [assume !pattern] block only to the checks
# that match the pattern, so a block written for _ch0 never reaches the _ch1 checks. The second retirement never
# traps (qv_commit's pair rule), so channel 1 needs only the satp pin (a translated access reports a physical address
# the spec's model does not know); satp is one channel, and a pair never changes it (a CSR write retires alone).
#
# unique and liveness assume a retirement on their channel at the trigger cycle: channel 1 needs a pair there, so
# the trigger is 12 here (10 in the one-channel model). cover asks for one instruction on channel 1.

[options]
isa rv64ic
nret 2
nbus 0
solver bitwuzla

[depth]
insn            15
reg        5    15
pc_fwd     5    15
pc_bwd     5    15
unique     1 12 22
causal     5    15
cover      1    15
ill             15
liveness   1 12 40
hang       1    40

# as in the one-channel model: these export the trap CSRs to the checker, which the channel-0 pins below read
# (without them rvfi_csr_mcause_wdata is an unconnected wire there, and the cause pin excludes nothing)
[csrs]
mepc any_mask="64'hfffffffffffffffe"
mcause any
sepc any_mask="64'hfffffffffffffffe"
scause any

[defines]
`define RISCV_FORMAL
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_CSR_PMPCFG0
`define RISCV_FORMAL_CSR_PMPADDR0
`define RISCV_FORMAL_CSR_MEDELEG

[defines liveness]
`define QV_FORMAL_NO_DIV

[defines hang]
`define QV_FORMAL_NO_DIV

[cover]
always @* if (!reset) cover (channel[1].cnt_insns == 1);

[script-defines]
plugin -i /home/potato/yosys-slang-src/build/slang.so

[script-sources]
# @PIPE_RTL@ is replaced by sync_core.sh with the pipelined core's files, from design_files.list
read_slang --single-unit -I @basedir@/cores/@core@/design -I . -I @basedir@/checks -D RISCV_FORMAL -D QV_FORMAL_SMALL -D QV_FORMAL_NO_MUL -D QV_FORMAL_NO_SV39 -D QV_FORMAL_NO_FPU -D QV_PIPE_COMMIT_W=2 -D QV_PIPE_DISPATCH_W=2 -D QV_PIPE_ALU_PORTS=2 @basedir@/cores/@core@/wrapper.sv @PIPE_RTL@

[script-link]
memory_map

# channel 0: the one-channel model's pins, on the channel-0 slices
[assume !insn_.*_ch0 !c_.*_ch0]
always @* assume (rvfi_csr_pmpcfg0_rdata[63:0] == 64'h0000_0000_0000_001f);
always @* assume (rvfi_csr_pmpaddr0_rdata[63:0] == 64'h003f_ffff_ffff_ffff);

[assume !insn_.*_ch0 !c_.*_ch0]
always @* assume (rvfi_csr_medeleg_rdata[1]  == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[5]  == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[7]  == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[12] == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[13] == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[15] == 1'b0);
always @* if (rvfi_valid[0] && rvfi_trap[0]) assume (
    rvfi_csr_mcause_wdata[63:0] != 64'd1  && rvfi_csr_mcause_wdata[63:0] != 64'd5  &&
    rvfi_csr_mcause_wdata[63:0] != 64'd7  && rvfi_csr_mcause_wdata[63:0] != 64'd12 &&
    rvfi_csr_mcause_wdata[63:0] != 64'd13 && rvfi_csr_mcause_wdata[63:0] != 64'd15
);

# both channels: satp Bare (one channel: the core's satp at the commit)
[assume !insn_.*_ch0 !c_.*_ch0 !insn_.*_ch1 !c_.*_ch1]
always @* assume (rvfi_csr_satp_rdata == 64'b0);

[assume !reg_ch0 !reg_ch1]
always @* assume (!rvfi_any_debug_entry);
