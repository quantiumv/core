# riscv-formal configuration for the 18 AMO checks of the pipelined core (insn_amo*), the A
# extension's check against riscv-formal's own spec model. Everything is the
# same as ../quantiumv_pipe/checks.cfg except the instruction set manifest:
# isa rv64ia (the hand-built insns/isa_rv64ia.txt, base integer plus the AMOs;
# LR/SC have no spec model upstream) and a longer insn window, because an AMO
# is a bus read, a modify and a bus write behind the pipeline's own latency.
# Only the insn_amo* checks are of interest here; run them with
#   sync_core.sh pipe-amo
#   run_sweep.sh pipe-amo -j 8 --only '^insn_amo'
# The rest of the generated set is the same as the main sweep's.

[options]
isa rv64ia
nbus 0
solver bitwuzla

[depth]
insn            20
reg        5    15
pc_fwd     5    15
pc_bwd     5    15
# unique assumes a retirement at its trigger cycle (the middle number). The
# FSM retires by cycle 5, but the pipelined core's first retirement is later (fetch,
# align, decode, issue, execute, commit), so a trigger of 5 is unsatisfiable
# (PREUNSAT). Trigger at 10 and look 10 cycles on.
unique     1 10 20
causal     5    15
cover      1    15
ill             15
csrc_any   5    15
# no divide reaches the divider in these two checks (QV_FORMAL_NO_DIV, below
# and in wrapper.sv): a divide takes ~66 cycles, longer than the window. The
# longest gap between retirements otherwise is a serializing refetch plus
# bus waits, well under 30 cycles
liveness   1 10 40
hang       1    40

[csrs]
mepc any_mask="64'hfffffffffffffffe"
mcause any
sepc any_mask="64'hfffffffffffffffe"
scause any

[defines]
`define RISCV_FORMAL
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_CSR_PMPCFG0
`define RISCV_FORMAL_CSR_PMPADDR0
`define RISCV_FORMAL_CSR_MEDELEG

[defines liveness]
`define QV_FORMAL_NO_DIV

[defines hang]
`define QV_FORMAL_NO_DIV

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);

[script-defines]
plugin -i /home/potato/yosys-slang-src/build/slang.so

[script-sources]
# @PIPE_RTL@ is replaced by sync_core.sh with the pipelined core's files, from design_files.list
read_slang --single-unit -I @basedir@/cores/@core@/design -I . -I @basedir@/checks -D RISCV_FORMAL -D QV_FORMAL_SMALL -D QV_FORMAL_NO_MUL -D QV_FORMAL_NO_SV39 -D QV_FORMAL_NO_FPU @basedir@/cores/@core@/wrapper.sv @PIPE_RTL@

[script-link]
# The register file, ROB, producer table and CSR state become flops and
# muxes instead of SMT arrays. Same behaviour; the solvers' array reasoning
# was the bottleneck on this core (hang, depth 40: the satisfiability
# pre-check alone ran more than 5 hours of CPU without finishing, now the
# whole check takes 8 minutes; insn_c_beqz: 28 minutes down to 8).
memory_map

[assume !csrc_any_(mepc|mcause)_ch0]
always @* if (rvfi_valid) assume (rvfi_mode == 2'b11);

[assume !csrc_any_(sepc|scause)_ch0]
always @* if (rvfi_valid) assume (rvfi_mode != 2'b00);

[assume !csrc_any_(mepc|mcause|sepc|scause)_ch0]
always @* assume (!rvfi_any_trap_taken);

[assume !insn_.*_ch0 !c_.*_ch0]
always @* assume (rvfi_csr_pmpcfg0_rdata == 64'h0000_0000_0000_001f);
always @* assume (rvfi_csr_pmpaddr0_rdata == 64'h003f_ffff_ffff_ffff);

[assume !insn_.*_ch0 !c_.*_ch0]
always @* assume (rvfi_csr_medeleg_rdata[1]  == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[5]  == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[7]  == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[12] == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[13] == 1'b0);
always @* assume (rvfi_csr_medeleg_rdata[15] == 1'b0);
always @* if (rvfi_valid && rvfi_trap) assume (
    rvfi_csr_mcause_wdata != 64'd1  && rvfi_csr_mcause_wdata != 64'd5  &&
    rvfi_csr_mcause_wdata != 64'd7  && rvfi_csr_mcause_wdata != 64'd12 &&
    rvfi_csr_mcause_wdata != 64'd13 && rvfi_csr_mcause_wdata != 64'd15
);

[assume !insn_.*_ch0 !c_.*_ch0]
always @* assume (rvfi_csr_satp_rdata == 64'b0);

[assume !reg_ch0]
always @* assume (!rvfi_any_debug_entry);
