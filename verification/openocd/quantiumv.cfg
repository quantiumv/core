#
# Milestone 10b (EBREAK/JTAG staged plan, full-stack OpenOCD integration):
# OpenOCD config targeting verification/openocd/sim_main.cpp's own
# remote_bitbang server (a Verilator simulation of the real, unmodified
# design/soc.sv). IDCODE (0x00001001) matches design/jtag_tap.sv's own
# IDCODE_VAL exactly ({4'h0, 16'h0001, 11'h000, 1'b1}, hand-verified).
#
# `riscv set_mem_access sysbus` only, deliberately NOT the default
# `sysbus progbuf abstract` chain -- keeps every "read/write memory"
# checklist item in m10_smoke.tcl unambiguously exercising Milestone 8's
# System Bus Access path. The Program Buffer path (Milestone 7) is
# exercised separately and explicitly via `riscv set_mem_access progbuf`
# for exactly one checklist item, proving Milestone 10a's
# abstractauto.autoexecdata fix through BOTH real access paths
# independently, not just once.

adapter driver remote_bitbang
remote_bitbang port 9824
remote_bitbang host localhost

# No real hardware adapter timing to match -- a software TCP bridge has
# no meaningful "speed" of its own (see sim_main.cpp's own CLK_TICKS_PER_EVENT
# for the only knob that actually matters here). Set explicitly anyway to
# silence OpenOCD's own "not selected" warning and its low-speed (100 kHz)
# default -- remote_bitbang doesn't actually honor this as real adapter
# timing (confirmed: OpenOCD itself reports "This adapter doesn't support
# configurable speed"), so the specific value is arbitrary.
adapter speed 1000

jtag newtap quantiumv cpu -irlen 5 -expected-id 0x00001001

target create quantiumv.cpu riscv -chain-position quantiumv.cpu

riscv set_mem_access sysbus

init
