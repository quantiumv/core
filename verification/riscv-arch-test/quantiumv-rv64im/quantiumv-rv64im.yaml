# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: quantiumv-rv64im
description: >
  QuantiumV single-cycle-retire RV64IMZca+Zicsr+U/S/M core (design/core.sv on
  the `dev` branch, 2026-08-10). No A/F/D/V (A is implemented on `dev` too --
  atomics -- but not yet declared here; see memory/c-extension-milestone.md).
  No PMP. No Sv39/Sv48/Sv57 (satp storage exists for a future MMU handoff but
  only Bare mode is functional today). Misaligned loads/stores are not
  performed directly -- they always raise a misaligned-address exception
  (mem_load_misaligned/mem_store_misaligned, causes 4/6); see MISALIGNED_LDST
  below. No interrupts (mie/mip/mideleg are real,
  inert storage; no interrupt source exists). EBREAK is a permanent sim-only
  halt, not a real breakpoint trap -- a known, tracked pre-tapeout gap (see
  memory/known-gap-ebreak-sim-halt.md).
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zca, version: "= 1.0.0" } # RV64 compressed instructions -- no Zcf/Zcd (no F/D)
  - { name: U, version: "= 1.0.0" }
  - { name: S, version: "= 1.12.0" }
  - { name: Sm, version: "= 1.12.0" }
  - { name: Svbare, version: "= 1.0.0" } # satp's only functional MODE value -- must be declared explicitly, not just implied by SATP_MODE_BARE

params:
  # --- Sm (machine-mode base) params ---
  MXLEN: 64
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true # spec-mandated; our DUT halts sim instead of trapping -- known gap, expect these tests to fail
  MARCHID_IMPLEMENTED: false # csr_file.sv: marchid hardwired to 0 -- per spec, 0 IS the "not implemented" sentinel, not a real assigned ID
  MIMPID_IMPLEMENTED: false # csr_file.sv: mimpid hardwired to 0, same reasoning
  VENDOR_ID_BANK: 0x0
  VENDOR_ID_OFFSET: 0x0
  MISALIGNED_LDST: false # per the UDB param definition (params/MISALIGNED_LDST.yaml): "Does the
                          # implementation perform non-atomic misaligned loads/stores to main memory?
                          # If not, the implementation always throws a misaligned exception." false is
                          # correct here -- core.sv's mem_load_misaligned/mem_store_misaligned (causes
                          # 4/6) always trap rather than performing the access. (Earlier revisions of
                          # this comment had the polarity backwards -- false does NOT mean "no exception
                          # exists"; it means the opposite, "always excepts." The value was already
                          # correct even before that RTL fix landed, since the old silent mem_sel-shift
                          # truncation neither performed a correct misaligned access NOR trapped one --
                          # ACT4's ExceptionsZc-00 genuinely failed under this same flag back then,
                          # exactly as this flag's semantics predict, and is expected to pass now.)
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  TRAP_ON_ILLEGAL_WLRL: false
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: false # csr_file.sv: unmapped CSR reads 0, writes silently ignored, no trap (deliberate, Zicsr-milestone decision)
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  # Confirmed true via direct trace comparison against sail_riscv_sim (2026-08-17, root-causing
  # ACT4's ExceptionsZc-00 failure): core.sv's mem_load_misaligned/mem_store_misaligned trap arm
  # unconditionally sets trap_val = mem_paddr (the faulting address) -- this was already true
  # before this fix, just never reflected here. With this left `false`, the Sail reference model
  # (driven by sail.json's matching xtval_nonzero fields) computed mtval=0 for every misaligned
  # load/store, while every ACT4 self-check comparison against our core's real (nonzero) mtval
  # failed -- confirmed via `--trace-reg` showing `CSR mtval (0x343) -> 0x0000000000000000` on
  # Sail's side at the exact instruction where core.sv would report the real address instead.
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: false
  # Bus-error trapping (2026-08-17): core.sv's mem_load_access_fault/mem_store_access_fault/
  # fetch_fault_q all report the real faulting address in trap_val (mem_paddr/amo_addr_q/pc,
  # same convention as the misaligned-access causes above) -- these three flags flip to true
  # for the same reason those did, so the declared config matches actual RTL behavior from the
  # start rather than needing a second, separate root-cause pass later.
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_LOAD_PAGE_FAULT: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_PAGE_FAULT: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_PAGE_FAULT: false
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true # core.sv: trap_val = zero-extended raw instruction on illegal-instr
  MTVAL_WIDTH: 64
  CONFIG_PTR_ADDRESS: 0
  PMA_GRANULARITY: 3
  PHYS_ADDR_WIDTH: 32 # fetch_addr/mem_addr are truncated to 32 bits driving the Wishbone bus, despite 64-bit internal wires
  M_MODE_ENDIANNESS: little
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_M: false
  MTVEC_ACCESS: rw
  MTVEC_MODES: [0, 1] # mtvec_q is a plain unmasked R/W register -- both mode-bit values round-trip on write (see note below)
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: retain
  NUM_PMP_ENTRIES: 0
  MSTATUS_FS_LEGAL_VALUES: [0] # no F/D -- FS field always reads Off
  MSTATUS_VS_LEGAL_VALUES: [0] # no V -- VS field always reads Off
  MCOUNTENABLE_EN:
    [
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ] # mcounteren delegates access to the Zicntr unprivileged views, which don't exist here --
      # every bit is meaningless (all false) even though mcycle/minstret themselves exist (see HPM_COUNTER_EN)
  HPM_COUNTER_EN:
    [
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ] # NOTE: empirically confirmed (see verification notes) that setting index 0/2 true here while
      # Zihpm is unimplemented crashes UDB 0.1.9's solver ("bad validity check") -- mcycle/minstret's
      # existence is NOT represented via this array at all; it's scoped entirely to Zihpm's optional counters
  COUNTINHIBIT_EN:
    [
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ] # mcountinhibit is not implemented at all in this core

  # --- U params ---
  MUTABLE_MISA_U: false
  U_MODE_ENDIANNESS: little
  UXLEN: [64]
  TRAP_ON_ECALL_FROM_U: true

  # --- S params ---
  MUTABLE_MISA_S: false
  ASID_WIDTH: 0
  S_MODE_ENDIANNESS: little
  SXLEN: [64]
  TRAP_ON_ECALL_FROM_S: true
  REPORT_VA_IN_STVAL_ON_BREAKPOINT: false
  # Same fix as REPORT_VA_IN_MTVAL_ON_LOAD/STORE_AMO_MISALIGNED above -- csr_file.sv routes the
  # SAME i_trap_val wire to stval_q whenever i_trap_to_s is set (core.sv computes trap_val once,
  # unconditional on trap target), so an S-mode-targeted misaligned load/store reports the real
  # faulting address exactly like an M-mode one does.
  REPORT_VA_IN_STVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_MISALIGNED: false
  # Same fix as REPORT_VA_IN_MTVAL_ON_*_ACCESS_FAULT above -- same shared i_trap_val wire.
  REPORT_VA_IN_STVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_LOAD_PAGE_FAULT: false
  REPORT_VA_IN_STVAL_ON_STORE_AMO_PAGE_FAULT: false
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_PAGE_FAULT: false
  REPORT_ENCODING_IN_STVAL_ON_ILLEGAL_INSTRUCTION: true # csr_file.sv routes the same i_trap_val to sepc/stval on an S-target trap
  STVAL_WIDTH: 64
  STVEC_MODE_DIRECT: true
  STVEC_MODE_VECTORED: true # stvec_q is likewise a plain unmasked R/W register, same caveat as MTVEC_MODES
  SATP_MODE_BARE: true # only Bare is functional; Sv39/48/57 not declared as implemented extensions below
  MSTATUS_TVM_IMPLEMENTED: false # TVM bit has real storage but is not enforced -- SFENCE.VMA is an unconditional NOP today (documented, deferred to the Sv39 milestone)
  TRAP_ON_SFENCE_VMA_WHEN_SATP_MODE_IS_READ_ONLY: false # core.sv: SFENCE.VMA never traps, regardless of satp.MODE -- matches sail.json's Svbare.sfence_vma_illegal_if_svbare_only:false
  SCOUNTENABLE_EN:
    [
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ] # same reasoning as MCOUNTENABLE_EN -- no Zicntr means every delegation bit is meaningless
